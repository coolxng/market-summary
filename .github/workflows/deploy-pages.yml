name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build Static Site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          # Optional. Leave the repository variable unset to build without analytics.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        run: npm run build:pages

      - name: Validate Static Export
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/reports/index.html
          test -f out/reports/2026-09-18/index.html
          test -f out/reports/2026-09-18/report.json
          grep -q '/market-summary/_next/' out/index.html
          grep -q 'THE DAILY TAPE' out/index.html
          grep -q 'THE DAILY TAPE' out/reports/2026-09-18/index.html
          grep -q 'ARCHIVED DAILY TAPE' out/reports/2026-09-18/index.html
          ! grep -q 'Daily Market Close' out/reports/2026-09-18/index.html
          grep -q 'reports/2026-09-18' out/sitemap.xml

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
