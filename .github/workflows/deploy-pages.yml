name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build Static Site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/
          # Optional. Leave the repository variable unset to build without analytics.
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        run: npm run build:pages

      - name: Validate Static Export
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/reports/index.html
          test -f out/reports/2026-09-18/index.html
          test -f out/reports/2026-09-18/report.json
          grep -q '/market-summary/_next/' out/index.html
          grep -q 'THE DAILY TAPE' out/index.html
          grep -q 'THE DAILY TAPE' out/reports/2026-09-18/index.html
          grep -q 'ARCHIVED DAILY TAPE' out/reports/2026-09-18/index.html
          ! grep -q 'Daily Market Close' out/reports/2026-09-18/index.html
          grep -q 'reports/2026-09-18' out/sitemap.xml
          python3 scripts/validate_export.py --site-url "${{ steps.pages.outputs.base_url }}/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
