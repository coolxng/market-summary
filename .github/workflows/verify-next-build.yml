name: Verify Next.js build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-next-build.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Static Site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: "https://coolxng.github.io/market-summary/"
        run: npm run build:pages

      - name: Validate Static Export
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          grep -q '/market-summary/_next/' out/index.html
          grep -q 'THE DAILY TAPE' out/index.html

# Temporary verification workflow; remove after a successful run.
