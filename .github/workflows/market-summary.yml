name: Generate Daily Market Summary

on:
  schedule:
    # Runs weekdays at 21:30 UTC: 5:30 p.m. EDT or 4:30 p.m. EST, after the U.S. close.
    # GitHub cron cannot exclude U.S. market holidays; the generator skips when no new session data exists.
    - cron: '30 21 * * 1-5'

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-summary
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Generate or Skip the Daily Report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Run Tests
        run: python -m unittest -v

      - name: Validate Generated Artifacts
        run: |
          python -c "import json; from pathlib import Path; snapshot = json.loads(Path('report_snapshot.json').read_text()); assert Path('public/legacy-report.html').exists(); assert snapshot['report_type'] == 'daily_market_close'; assert snapshot['session_date'] > snapshot['previous_session_date']; assert snapshot['market_data']['^GSPC']['end_price'] > 0; assert snapshot['market_data']['^IXIC']['end_price'] > 0; assert snapshot['market_data']['^TNX']['end_price'] > 0; assert snapshot['daily_market_breadth']['positive_sector_share'] >= 0"
          npm ci --ignore-scripts
          npm run build

      - name: Commit and Push Daily Artifacts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add report_snapshot.json public/legacy-report.html
          if git diff --cached --quiet; then
            echo "No new completed session to commit"
            exit 0
          fi
          git commit -m "Automated Daily Market Summary update"
          git push
