name: Generate Weekly Market Summary

on:
  schedule:
    # Runs at 20:40 UTC every Friday (3:40PM CDT / 40 min after market close)
    # Earlier fire time gives buffer for GitHub Actions scheduling delays
    - cron: '40 20 * * 5'

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Generate the HTML Report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_report.py

      - name: Run Tests
        run: python -m unittest -v

      - name: Validate Generated Artifacts
        run: |
          python -c "import json; from pathlib import Path; snapshot = json.loads(Path('report_snapshot.json').read_text()); assert Path('index.html').exists(); assert snapshot['market_data']['^GSPC']['end_price'] > 0; assert snapshot['market_data']['^IXIC']['end_price'] > 0; assert snapshot['market_data']['^TNX']['end_price'] > 0; assert snapshot['market_breadth']['positive_sector_share'] >= 0"

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html report_snapshot.json
          git commit -m "Automated Weekly Market Summary update" || echo "No changes to commit"
          git push
