[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
watchPatterns = ["**", "!/data/report_snapshot.json", "!/public/reports/**/report.json", "!/data/morning_snapshot.json", "!/public/morning/latest.json"]

[deploy]
startCommand = "python pipeline/railway_cron.py"
cronSchedule = "*/15 20-22 * * 1-5"
restartPolicyType = "NEVER"
